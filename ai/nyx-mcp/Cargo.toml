[package]
name = "nyx-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Model Context Protocol server (stdio) for nyx: lets an AI host run geometry, mesh, solve and analysis steps"

[[bin]]
name = "nyx-mcp"
path = "src/main.rs"

[dependencies]
nyx-session = { path = "../nyx-session" }
serde_json = { version = "1", features = ["float_roundtrip"] }
