# The AI side of nyx: a stdio MCP server over femcore, in its own workspace so that nothing in ../crates is touched.
# Build:  cd ai && cargo build --release -p nyx-mcp      (binary: target/release/nyx-mcp)
# The path dependencies read ../crates/femcore and ../crates/geom as they are.
[workspace]
resolver = "2"
members = ["nyx-session", "nyx-mcp", "nyx-connect"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

# same profile choices as the root workspace: the solvers are unusably slow at opt-level 0
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
