[workspace]
resolver = "2"
members = ["crates/femcore", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[profile.dev]
opt-level = 1            # solvers are unusably slow at opt-level 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
