[workspace]
resolver = "2"
members = [
    "crates/geom",
    "crates/femcore",
    "crates/nyx-physics",
    "crates/nyx-dfs",
    "crates/nyx-sms",
    "crates/nyx-ems",
    "crates/nyx-analysis",
    "crates/nyx-store",
    "crates/nyx-storage",
    "crates/nyx-engine",
    "crates/nyx-mcp",
    "crates/nyx-script",
    "crates/nyx-connect",
    "crates/nyx-install",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-only OR LicenseRef-nyx-Commercial"
repository = "https://github.com/p-j-r/nyx"
# nothing in this workspace is meant for crates.io
publish = false

[profile.dev]
opt-level = 1            # solvers are unusably slow at opt-level 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false

[workspace.dependencies]
# Primary pure-Rust HDF5 read/write/in-place-edit engine (13/13 EC gates passed)
hdf5-pure = { version = "=0.48.0", default-features = true }
# Unify flate2 across the entire workspace onto 100% pure-Rust SIMD zlib-rs (v0.6.8)
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
anyhow = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
