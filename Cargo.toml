[workspace]
resolver = "2"
members = [
    "crates/geom",
    "crates/femcore",
    "crates/nyx-physics",
    "crates/nyx-dfs",
    "crates/nyx-sms",
    "crates/nyx-ems",
    "crates/nyx-analysis",
    "crates/nyx-store",
    "crates/nyx-engine",
    "crates/nyx-mcp",
    "crates/nyx-connect",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"

[profile.dev]
opt-level = 1            # solvers are unusably slow at opt-level 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
