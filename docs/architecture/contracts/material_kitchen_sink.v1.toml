# Contract exemplar of material file format 1: one file that uses every section (see docs/MATERIALS.md for the guide).
# The numbers are made up. The test crates/femcore/tests/material_contract.rs reads this file and compares the result with
# material_kitchen_sink.v1.json.
format = 1
name = "kitchen_sink"
description = "Every section of the format, with invented numbers"
source = ["Invented for the contract test", "Second reference"]
notes = "An orthotropic crystal with a different dispersion model along each axis."
density = "2500 kg/m^3"

[elastic]
class = "orthotropic"          # nine independent constants; other forms: matrix, compliance, E and nu, other classes
unit = "GPa"
c11 = 200.0
c22 = 180.0
c33 = 160.0
c12 = 60.0
c13 = 55.0
c23 = 50.0
c44 = 40.0
c55 = 45.0
c66 = 50.0

[thermal]
conductivity = [1.0, 2.0, 3.0]                 # x y z
conductivity_unit = "W/(m*K)"
specific_heat = "800 J/(kg*K)"
expansion = [1.0e-6, 2.0e-6, 3.0e-6, 0.0, 0.0, 0.0]   # xx yy zz yz xz xy
expansion_unit = "1/K"

[electrical]
permittivity = [[4.0, 0.0, 0.0], [0.0, 5.0, 0.0], [0.0, 0.0, 6.0]]
permeability = 1.0
conductivity = "1e-12 S/m"

[optical]
wavelength_unit = "um"           # the unit of range, coefficients and table
range = [0.5, 1.6]               # a wavelength outside it is an error
reference_temperature = "20 degC"

[optical.x]
model = "sellmeier"
A = 1.1
B = [1.0, 0.5]
C = [0.01, 100.0]
dn_dT = "2e-5 1/K"

[optical.y]
model = "cauchy"
coefficients = [1.5, 0.005, 0.0001]

[optical.z]
model = "tabulated"
interpolation = "linear"
data = [[0.4, 1.60, 0.0], [1.0, 1.55, 0.001], [1.7, 1.52, 0.01]]
dn_dT = "1e-5 1/K"
