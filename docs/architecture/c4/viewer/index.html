ot,<br />engine +2<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->26\n    8-. \"<div>uses fmt, kit +1<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->11\n    8-. \"<div>uses app, spans +1<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->7\n    10-. \"<div>uses engine: crate root<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->26\n    10-. \"<div>uses fmt, theme +1<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->11\n    7-. \"<div>uses connect: config, env +1<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->20\n    7-. \"<div>uses engine: crate root,<br />engine +7<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->26\n    7-. \"<div>uses pyscript<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->12\n    7-. \"<div>uses geomui<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->9\n    7-. \"<div>uses activity, examples +2<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->8\n    7-. \"<div>uses cvd, fmt +2<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->11\n    7-. \"<div>uses colormap, regions +1<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->10\n\n  end"],
["3 Components","nyx-mcp","graph TB\n  linkStyle default fill:#ffffff\n\n  subgraph diagram [\"Component View: nyx - nyx-mcp\"]\n    style diagram fill:#ffffff,stroke:#ffffff\n\n    subgraph 5 [\"nyx\"]\n      style 5 fill:#ffffff,stroke:#0b4884,color:#0b4884\n\n      subgraph 13 [\"nyx-mcp\"]\n        style 13 fill:#ffffff,stroke:#2e6295,color:#2e6295\n\n        14[\"<div style='font-weight: bold'>Protocol loop<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>Newline-delimited JSON-RPC<br />2.0 over stdin/stdout:<br />initialize with protocol<br />negotiation, method dispatch,<br />notifications, logs on<br />stderr. No async runtime and<br />no SDK.<\/div>\"]\n        style 14 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        15[\"<div style='font-weight: bold'>Tool bridge<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>The tool list is the engine's<br />command catalog (with<br />annotations: read-only,<br />destructive); a tool call is<br />Engine::call, its reply<br />rendered as text.<\/div>\"]\n        style 15 fill:#85bbf0,stroke:#5d82a8,color:#000000\n      end\n\n      26[\"<div style='font-weight: bold'>nyx-engine<\/div><div style='font-size: 70%; margin-top: 0px'>[Container: Rust library]<\/div><div style='font-size: 80%; margin-top:10px'>The Engine: one project, the<br />mesh built for it, the latest<br />result of each physics, the<br />jobs that produce them, and<br />the binding to a workflow.<br />Every action is a named<br />command with a JSON Schema.<\/div>\"]\n      style 26 fill:#438dd5,stroke:#2e6295,color:#ffffff\n    end\n\n    14-. \"<div>Server instructions text<\/div><div style='font-size: 70%'>[declared in spec]<\/div>\" .->26\n    15-. \"<div>One tool per command: catalog<br />and call<\/div><div style='font-size: 70%'>[declared in spec]<\/div>\" .->26\n\n  end"],
["3 Components","nyx-script","graph TB\n  linkStyle default fill:#ffffff\n\n  subgraph diagram [\"Component View: nyx - nyx-script\"]\n    style diagram fill:#ffffff,stroke:#ffffff\n\n    subgraph 5 [\"nyx\"]\n      style 5 fill:#ffffff,stroke:#0b4884,color:#0b4884\n\n      subgraph 16 [\"nyx-script\"]\n        style 16 fill:#ffffff,stroke:#2e6295,color:#2e6295\n\n        17[\"<div style='font-weight: bold'>Script host<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>Runs a script (Python syntax,<br />`*.nys`) through a worker<br />process and answers each<br />`nyx.<command>(...)` it makes<br />with Engine::call; the<br />limits, the clock and random<br />policy, the path guard turned<br />on for the run, the script<br />kept with the runs it makes;<br />`check` parses and<br />type-checks without running.<br />JSON to and from script<br />values.<\/div>\"]\n        style 17 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        18[\"<div style='font-weight: bold'>Type stub<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>The `nyx` object written as<br />Python declarations from<br />Engine::catalog(): the static<br />check, and the file an editor<br />reads.<\/div>\"]\n        style 18 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        19[\"<div style='font-weight: bold'>Worker program<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>The only place the Monty<br />interpreter runs: Monty's<br />worker mode over stdin and<br />stdout, with the allocator<br />that bounds its memory. A<br />script that exhausts memory<br />or the stack ends this<br />process, not the engine's.<\/div>\"]\n        style 19 fill:#85bbf0,stroke:#5d82a8,color:#000000\n      end\n\n      26[\"<div style='font-weight: bold'>nyx-engine<\/div><div style='font-size: 70%; margin-top: 0px'>[Container: Rust library]<\/div><div style='font-size: 80%; margin-top:10px'>The Engine: one project, the<br />mesh built for it, the latest<br />result of each physics, the<br />jobs that produce them, and<br />the binding to a workflow.<br />Every action is a named<br />command with a JSON Schema.<\/div>\"]\n      style 26 fill:#438dd5,stroke:#2e6295,color:#ffffff\n    end\n\n    17-. \"<div>uses engine: engine<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->26\n    17-. \"<div>uses stubs<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->18\n    18-. \"<div>uses engine: commands, engine<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->26\n    17-. \"<div>Frames over a pipe: the<br />script pauses at each command<br />and the host answers<\/div><div style='font-size: 70%'>[declared in spec]<\/div>\" .->19\n\n  end"],
["3 Components","nyx-connect","graph TB\n  linkStyle default fill:#ffffff\n\n  subgraph diagram [\"Component View: nyx - nyx-connect\"]\n    style diagram fill:#ffffff,stroke:#ffffff\n\n    subgraph 5 [\"nyx\"]\n      style 5 fill:#ffffff,stroke:#0b4884,color:#0b4884\n\n      subgraph 20 [\"nyx-connect\"]\n        style 20 fill:#ffffff,stroke:#2e6295,color:#2e6295\n\n        21[\"<div style='font-weight: bold'>Host table<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>Where each AI host (Claude<br />Code, Claude Desktop, ...)<br />keeps its MCP config and what<br />an entry looks like; the home<br />folder, application-data<br />folders and the operating<br />system.<\/div>\"]\n        style 21 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        22[\"<div style='font-weight: bold'>Host config<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>Reads and rewrites a host's<br />JSON config: status of the<br />nyx entry, connect,<br />disconnect, list.<\/div>\"]\n        style 22 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        23[\"<div style='font-weight: bold'>Server probe<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>Finds the nyx-mcp program,<br />builds the snippet for a host<br />that is not in the table, and<br />does a real MCP handshake<br />against it.<\/div>\"]\n        style 23 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        24[\"<div style='font-weight: bold'>Report<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>The machine-readable form of<br />what nyx-connect finds and<br />does, with its JSON Schema.<\/div>\"]\n        style 24 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        25[\"<div style='font-weight: bold'>Command line<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>The command-line twin of the<br />Connect menu: list, connect,<br />disconnect, test, optionally<br />as JSON.<\/div>\"]\n        style 25 fill:#85bbf0,stroke:#5d82a8,color:#000000\n      end\n\n    end\n\n    25-. \"<div>uses config<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->22\n    25-. \"<div>uses env<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->21\n    25-. \"<div>uses report<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->24\n    25-. \"<div>uses server<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->23\n    22-. \"<div>uses env<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->21\n    22-. \"<div>uses crate root<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->24\n    24-. \"<div>uses config<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->22\n    24-. \"<div>uses env<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->21\n    24-. \"<div>uses server<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->23\n    23-. \"<div>uses crate root<\/div><div style='font-size: 70%'>[Rust paths]<\/div>\" .->24\n\n  end"],
["3 Components","nyx-engine","graph TB\n  linkStyle default fill:#ffffff\n\n  subgraph diagram [\"Component View: nyx - nyx-engine\"]\n    style diagram fill:#ffffff,stroke:#ffffff\n\n    subgraph 5 [\"nyx\"]\n      style 5 fill:#ffffff,stroke:#0b4884,color:#0b4884\n\n      subgraph 26 [\"nyx-engine\"]\n        style 26 fill:#ffffff,stroke:#2e6295,color:#2e6295\n\n        27[\"<div style='font-weight: bold'>Commands<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>The Engine and its catalog:<br />every action by name with<br />JSON arguments, JSON Schema<br />and JSON reply; the<br />dispatcher; the guide cards a<br />host reads on demand; the<br />reductions of results (field<br />handles, integrals, extrema,<br />probes, overlaps). The window<br />and the MCP server use the<br />same entries.<\/div>\"]\n        style 27 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        28[\"<div style='font-weight: bold'>Project<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>The saved state: feature<br />list, mesh settings, one<br />ProblemSpec per physics,<br />project materials. The format<br />key is checked at the file<br />boundary.<\/div>\"]\n        style 28 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        29[\"<div style='font-weight: bold'>Geometry operations<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>Every edit of a geom feature<br />list as a function that does<br />it or says why not, and the<br />descriptors of the geom<br />operations (they live here<br />because geom depends on serde<br />only).<\/div>\"]\n        style 29 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        30[\"<div style='font-weight: bold'>Job runner and queue<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>Mesh, solve, convergence and<br />file jobs on their own<br />threads with progress and<br />cancel, queued in lanes<br />(priority, owners in turn,<br />stages shared by content),<br />solves in a worker process<br />(killed on cancel, its stage<br />log mirrored, results read<br />back from a file), memory<br />estimates learned from the<br />workers and admission by free<br />memory, solving physics in<br />the order of the one-way<br />couplings, mesh convergence<br />on a scratch engine.<\/div>\"]\n        style 30 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        31[\"<div style='font-weight: bold'>Command lists<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>A JSON-lines list of engine<br />commands is parsed, checked<br />against the catalog and its<br />schemas, planned on a scratch<br />engine (what would be meshed<br />and solved, nothing run) and<br />run in order through<br />Engine::call.<\/div>\"]\n        style 31 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        32[\"<div style='font-weight: bold'>API reference<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>One Markdown page per engine<br />command and an index,<br />generated from<br />Engine::catalog() (arguments<br />flattened from the schema, an<br />example that passes the<br />check); docs/api is compared<br />with it by a test.<\/div>\"]\n        style 32 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        33[\"<div style='font-weight: bold'>Meshing seam<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>MeshRequest to MeshedModel<br />(mesh, names, label<br />resolver); the only caller of<br />the femcore mesher; absorbing<br />layers across the two halves<br />of a project; trial meshes<br />and edit checks for the<br />feedback while editing (ADR<br />92).<\/div>\"]\n        style 33 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        34[\"<div style='font-weight: bold'>Materials<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>The material library plus the<br />materials a project carries,<br />resolved at the study<br />wavelength.<\/div>\"]\n        style 34 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        35[\"<div style='font-weight: bold'>Analyses<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>Runs the analyses of<br />nyx-analysis on the latest<br />result of a physics.<\/div>\"]\n        style 35 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        36[\"<div style='font-weight: bold'>Results files<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>HDF5 results (serial or<br />MPI-IO), the XDMF<br />description, and opening a<br />results file as a project<br />with its results.<\/div>\"]\n        style 36 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        37[\"<div style='font-weight: bold'>Store link<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>Binds the project to a<br />workflow of the workspace,<br />commits versions, records<br />runs (card and metrics made<br />here).<\/div>\"]\n        style 37 fill:#85bbf0,stroke:#5d82a8,color:#000000\n        38[\"<div style='font-weight: bold'>Registry and facade<\/div><div style='font-size: 70%; margin-top: 0px'>[Component: Rust modules]<\/div><div style='font-size: 80%; margin-top:10px'>The physics compiled in<br />(cargo features dfs, sms,<br />ems) and the facade that<br />re-exports what a front-end<br />draws with.<\/div>\"]\n        style 38 fill:#85bbf0,stroke:#5d82a8,color:#000000\n      end\n\n      107[\"<di const nav=document.getElementById('nav');let last='';
D.forEach((d,i)=>{if(d[0]!==last){const h=document.createElement('h2');h.textContent=d[0];nav.appendChild(h);last=d[0]}
const a=document.createElement('a');a.textContent=d[1];a.id='a'+i;a.onclick=()=>show(i);nav.appendChild(a)});
async function show(i){document.querySelectorAll('nav a.on').forEach(x=>x.classList.remove('on'));document.getElementById('a'+i).classList.add('on');
document.getElementById('t').textContent=D[i][1];document.getElementById('fit').onchange=e=>document.getElementById('d').classList.toggle('fit',e.target.checked);document.getElementById('g').textContent=D[i][0];document.getElementById('err').textContent='';
try{const r=await mermaid.render('m'+i,D[i][2]);document.getElementById('d').innerHTML=r.svg}catch(e){document.getElementById('d').innerHTML='';document.getElementById('err').textContent=String(e)}location.hash=i}
window.checkAll=async()=>{const bad=[];for(let i=0;i<D.length;i++){try{await mermaid.parse(D[i][2])}catch(e){bad.push([i,D[i][0],D[i][1],String(e).slice(0,300)])}}return bad};
show(Math.max(0,parseInt(location.hash.slice(1))||0));
