<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }} — {{ config.description }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">

  <script>
    (function () {
      try {
        var saved = localStorage.getItem("nyx-theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved === "dark" || saved === "light" ? saved : (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ get_url(path='main.css') }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }} Atom Feed" href="{{ get_url(path='atom.xml') }}">

  {% include "partials/katex.html" %}
  {% block extra_head %}{% endblock extra_head %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% include "partials/header.html" %}

  <main id="main-content" class="site-main">
    {% block content %}{% endblock content %}
  </main>

  {% include "partials/footer.html" %}
  <script defer src="{{ get_url(path='js/nyx-hub.js') }}"></script>
  {% block extra_scripts %}{% endblock extra_scripts %}
</body>
</html>
