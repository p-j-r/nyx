# One shared build directory for every jj workspace of this repository (nyx2, nyx2-mesh, ...): the registry dependencies (egui, wgpu, faer) are
# compiled once. The path is relative to the folder that holds `.cargo`, so it is the sibling folder `nyx2-target` for every workspace.
# Cargo serialises builds that use the same directory; set CARGO_TARGET_DIR to something else to opt out.
[build]
target-dir = "../nyx2-target"

# The HDF5 library (feature `hdf5`, on by default, ADR 63). `force = false`: an HDF5_DIR already set in the environment wins. This is the
# Anaconda install of the development machine; on another machine set HDF5_DIR to the prefix of its HDF5 library (and put its bin folder on PATH).
[env]
HDF5_DIR = { value = "C:/Users/robin-adm/anaconda3/Library", force = false }
