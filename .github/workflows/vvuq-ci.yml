name: VVUQ 3-Tier CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_tier3:
        description: "Run Tier 3 deep verification (ignored tests, Miri, Kani, Bolero, determinism matrix, telemetry)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  NYX_REQUIRE_H5PY: "1"
  # Prevent premature workspace-queue dead-lease expiry during heavy 3D factorizations / swapping (§7.3).
  NYX_QUEUE_LEASE_DEAD_SECS: "60"

permissions:
  contents: read

concurrency:
  group: vvuq-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tier1_pr_fast:
    name: "Tier 1: PR Fast Gate (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python h5py & numpy for HDF5 interop tests
        run: python -m pip install --quiet h5py numpy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Detect crates/app changes on PRs
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'crates/app/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

      - name: ADR governance check (Linux)
        if: runner.os == 'Linux'
        run: bash docs/architecture/check_code_to_adr.sh

      - name: ADR 65 formatting check (7 crates)
        run: cargo fmt --check -p geom -p nyx-physics -p nyx-dfs -p nyx-sms -p nyx-ems -p nyx-analysis -p nyx-engine

      - name: Clippy (--release, warnings denied)
        if: github.event_name != 'pull_request' || steps.changes.outputs.app == 'true'
        run: cargo clippy --release --workspace --all-targets --no-deps -- -D warnings

      - name: Clippy (--release, path-filtered --exclude nyx on PR)
        if: github.event_name == 'pull_request' && steps.changes.outputs.app != 'true'
        run: cargo clippy --release --workspace --exclude nyx --all-targets --no-deps -- -D warnings

      - name: Build nyx-script worker, nyx-worker & nyx-connect fake_mcp binaries
        run: |
          cargo build --release -p nyx-script
          cargo build --release -p nyx-engine --bin nyx-worker
          cargo build --release -p nyx-connect --example fake_mcp

      - name: Layering, contracts, API docs, path_guard, format, h5 & vvuq_report
        shell: bash
        run: |
          cargo test --release -p nyx-engine --test layering --test contracts --test geomdesc --test api_docs --test path_guard --test format --test vvuq_phase5_report --test h5
          cargo test --release -p femcore --test contracts --test linalg_contract --test material_contract
          cargo test --release -p geom -p nyx-physics -p nyx-dfs -p nyx-sms -p nyx-ems -p nyx-store -p nyx-mcp -p nyx-connect -p nyx-install --test contracts
          cargo test --release -p nyx-script --test contract

      - name: Soundness, SSRF, finite_guard, telemetry dry-run & deterministic proptest/bolero regressions
        shell: bash
        run: |
          python3 tools/vvuq_telemetry.py --dry-run
          cargo test --release -p nyx-engine --lib material_fetch
          cargo test --release -p geom --test props --test gds
          cargo test --release -p nyx-sms --test finite_guard
          for crate in nyx-dfs nyx-ems; do
            if [ -f "crates/${crate}/tests/finite_guard.rs" ]; then
              cargo test --release -p "${crate}" --test finite_guard
            fi
          done
          for t in fuzz_gds fuzz_nyx_storage fuzz_script_trace fuzz_path_and_archive fuzz_mcp_framing; do
            manifest_hits=$(grep -l "$t" crates/*/Cargo.toml 2>/dev/null || true)
            if [ -n "$manifest_hits" ] || [ -n "$(find crates -maxdepth 3 -name "${t}.rs" 2>/dev/null)" ]; then
              pkg=$(find crates -maxdepth 3 -name "${t}.rs" | head -n 1 | cut -d/ -f2)
              if [ -n "$pkg" ]; then
                cargo test --release -p "$pkg" --test "$t"
              fi
            fi
          done

  tier2_pr_merge:
    name: "Tier 2: Full Workspace & Portable-Kernels Parity (${{ matrix.os }})"
    needs: tier1_pr_fast
    if: github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python h5py & numpy for HDF5 interop tests
        run: python -m pip install --quiet h5py numpy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Tier 2 via local playbook script
        if: runner.os == 'Linux'
        run: bash tools/vvuq_ci.sh --tier 2

      - name: Run Tier 2 via PowerShell playbook script
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/vvuq_ci.ps1 -Tier 2

  tier3_cross_os_matrix:
    name: "Tier 3: Cross-OS Deep, Determinism, Validation & Telemetry (${{ matrix.os }})"
    needs: tier2_pr_merge
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_tier3)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python h5py & numpy for HDF5 interop tests
        run: python -m pip install --quiet h5py numpy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build nyx-script worker, nyx-worker & nyx-connect fake_mcp
        run: |
          cargo build --release -p nyx-script
          cargo build --release -p nyx-engine --bin nyx-worker
          cargo build --release -p nyx-connect --example fake_mcp

      - name: Run ignored deep verification suite
        run: cargo test --release --workspace -- --ignored

      - name: Cross-OS NYX_THREADS={1,4} & NYX_FACTOR_THREADS={1,4} determinism matrix
        shell: bash
        run: |
          set -euo pipefail
          for nt in 1 4; do
            NYX_THREADS="$nt" cargo test --release -p geom --features parallel --test arrangement
            NYX_THREADS="$nt" cargo test --release -p femcore --test linalg -- determinism
            NYX_THREADS="$nt" cargo test --release -p femcore --test periodic_mesh3d --test electro_amr --test rt_equilibration --test portable_kernels
            NYX_THREADS="$nt" cargo test --release -p femcore --features portable-kernels --test portable_kernels
            NYX_THREADS="$nt" cargo test --release -p nyx-dfs --test qcap_solvers --test farfield_electro
            NYX_THREADS="$nt" cargo test --release -p nyx-sms --test determinism
            NYX_THREADS="$nt" cargo test --release -p nyx-ems --test pml_mixed_curvilinear
            NYX_THREADS="$nt" cargo test --release -p nyx-analysis --test figure3d --test uq_cqed
            NYX_THREADS="$nt" cargo test --release -p nyx-engine --test squadds_engine_smoke --test vvuq_phase4_uq
            for crate in nyx-dfs nyx-ems nyx-engine; do
              if [ -f "crates/${crate}/tests/determinism.rs" ]; then
                NYX_THREADS="$nt" cargo test --release -p "${crate}" --test determinism
              fi
            done
            if [ -f "crates/nyx-engine/tests/vvuq_phase5_determinism.rs" ]; then
              NYX_THREADS="$nt" cargo test --release -p nyx-engine --test vvuq_phase5_determinism
            fi
          done
          for ft in 1 4; do
            NYX_THREADS=4 NYX_FACTOR_THREADS="$ft" cargo test --release -p nyx-ems --test golden -- golden_cavity_3d_box_v1 golden_bloch_3d_wire_v1 golden_driven_3d_prom_v1
            if [ -f "crates/nyx-ems/tests/determinism.rs" ]; then
              NYX_THREADS=4 NYX_FACTOR_THREADS="$ft" cargo test --release -p nyx-ems --test determinism
            fi
            if [ -f "crates/nyx-engine/tests/vvuq_phase5_determinism.rs" ]; then
              NYX_THREADS=4 NYX_FACTOR_THREADS="$ft" cargo test --release -p nyx-engine --test vvuq_phase5_determinism
            fi
          done

      - name: Cross-OS benchmarks/validation/ suites & R22 .fmsh oracle check
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -p nyx-engine \
            --test validation_cqed_cross_code \
            --test validation_cqed_experiment \
            --test validation_cqed_tls_scqubits \
            --test validation_mems_piezo \
            --test validation_photonics \
            --test validation_thermal_nafems
          cargo test --release -p femcore --test contracts -- mesh_fmsh_round_trip_and_version
          cargo test --release -p nyx-ems --test golden -- golden_soi_wire_and_hybrid_frozen_solver_oracles_r22

      - name: Quiet-runner best-of-3 telemetry ledger (wall-time, RSS, accuracy |E|)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vvuq_telemetry.py --trials 3 --out "runs/vvuq-telemetry-${{ matrix.os }}.json"

      - name: Upload Tier 3 telemetry ledger artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vvuq-telemetry-${{ matrix.os }}
          path: runs/vvuq-telemetry-${{ matrix.os }}.json
          if-no-files-found: warn

  tier3_linux_miri:
    name: "Tier 3: Linux Nightly Scoped Miri (Stacked & Tree Borrows)"
    needs: tier2_pr_merge
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_tier3)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly + Miri component (without modifying rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri

      - name: Run Miri under Stacked Borrows (non-rayon crates)
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: |
          cargo +nightly miri test -p geom --lib
          cargo +nightly miri test -p nyx-store --lib -- --skip size_ratio_and_count_caps_hold_and_corruption_is_detected

      - name: Run Miri under Tree Borrows + Strict Provenance (non-rayon crates)
        env:
          MIRIFLAGS: "-Zmiri-tree-borrows -Zmiri-strict-provenance -Zmiri-disable-isolation"
        run: |
          cargo +nightly miri test -p geom --lib
          cargo +nightly miri test -p nyx-store --lib -- --skip size_ratio_and_count_caps_hold_and_corruption_is_detected

      - name: Run Miri under Tree Borrows (rayon targets, NYX_THREADS=2)
        env:
          NYX_THREADS: "2"
          # Third-party crossbeam-epoch 0.9.21 requires Tree Borrows without strict-provenance; rayon global pool threads require -Zmiri-ignore-leaks.
          MIRIFLAGS: "-Zmiri-tree-borrows -Zmiri-ignore-leaks -Zmiri-disable-isolation"
        run: |
          cargo +nightly miri test -p femcore --lib linalg::par::
          cargo +nightly miri test -p femcore --lib linalg::csr::
          cargo +nightly miri test -p femcore --lib linalg::basis::
          cargo +nightly miri test -p femcore --lib linalg::vecops::
          cargo +nightly miri test -p femcore --lib linalg::amg_elastic::
          cargo +nightly miri test -p nyx-physics --lib

  tier3_linux_kani:
    name: "Tier 3: Linux Kani Bounded Model Checking (K1-K3)"
    needs: tier2_pr_merge
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_tier3)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kani verifier
        uses: model-checking/kani-github-action@v1

      - name: Run Kani K1 (femcore sparse CSR & RawCols)
        run: |
          cargo kani -p femcore --harness verify_csr_rows_into
          cargo kani -p femcore --harness verify_triplets_to_csr
          cargo kani -p femcore --harness verify_csr_sum_all
          cargo kani -p femcore --harness verify_raw_cols_disjoint_chunks
          cargo kani -p femcore --harness verify_raw_cols_rejects_overflow

      - name: Run Kani K2 (nyx-storage read budgets & packed slice arithmetic)
        run: cargo kani -p nyx-storage --harness verify_read_budget_no_overflow

      - name: Run Kani K3 (geom GDSII IBM float codec & framing bounds)
        run: cargo kani -p geom --harness verify_gds_ibm_and_framing

  tier3_linux_bolero:
    name: "Tier 3: Linux Nightly Time-Boxed Bolero LibFuzzer + ASan"
    needs: tier2_pr_merge
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_tier3)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly for libFuzzer/ASan
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cargo-bolero
        run: cargo +nightly install --locked cargo-bolero

      - name: Run time-boxed (900s/target) Bolero LibFuzzer + ASan campaigns
        run: |
          for target in fuzz_gds fuzz_nyx_storage fuzz_script_trace fuzz_path_and_archive fuzz_mcp_framing; do
            if [ -n "$(find crates -maxdepth 3 -name "${target}.rs" 2>/dev/null)" ]; then
              pkg=$(find crates -maxdepth 3 -name "${target}.rs" | head -n 1 | cut -d/ -f2)
              cargo +nightly bolero test -p "$pkg" --engine libfuzzer --sanitizer address --time 900 "$target"
            else
              echo "Skipping $target (not present in workspace)"
            fi
          done
