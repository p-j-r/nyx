[package]
name = "femcore"
version.workspace = true
edition.workspace = true
license = "(AGPL-3.0-only OR LicenseRef-nyx-Commercial) AND BSD-2-Clause"
rust-version.workspace = true
description = "Finite-element core: meshes, meshing and adaptation, linear algebra, the finite-element basics the physics crates share, and the material specification"

[dependencies]
geom = { path = "../geom" }
faer = "0.24"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
spade = "2.15.1"
rayon = "1"
toml = { version = "1", features = ["preserve_order"] }

[features]
# solvers: use only the portable kernels. The default routes the restart multiply V <- V*Q of the block
# Krylov-Schur eigensolver through faer GEMM, which is much faster but picks FMA/blocking by CPU, so its last bits
# can differ between machines (never between thread counts).
portable-kernels = []
