[package]
name = "nyx"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nyx-engine = { path = "../nyx-engine" }
nyx-connect = { path = "../nyx-connect" }
nyx-script = { path = "../nyx-script" }
rayon = "1"
eframe = "0.37"
winit = { version = "0.30", default-features = false }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
egui_plot = "0.38"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# fixtures of the drawing tests (a meshed plate and block); normal dependencies are only the engine and the connect crate (layering table)
femcore = { path = "../femcore" }

[features]
# the results of every run in HDF5 files (pure-Rust hdf5-pure + zlib-rs; requires no external HDF5_DIR or DLL)
hdf5 = ["nyx-engine/hdf5"]

[target."cfg(windows)".dependencies]
muda = "0.21.2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
