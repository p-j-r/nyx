[package]
name = "nyx-physics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The interface between nyx and a physics: the Physics trait, the problem envelope, descriptors, results and the registry"

[dependencies]
