[package]
name = "nyx-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The nyx engine: the project, its commands, the job runner and the registry of compiled-in physics. Shared by the window and the MCP server"

[dependencies]
nyx-physics = { path = "../nyx-physics" }
nyx-dfs = { path = "../nyx-dfs", optional = true }
nyx-sms = { path = "../nyx-sms", optional = true }
nyx-ems = { path = "../nyx-ems", optional = true }
nyx-analysis = { path = "../nyx-analysis" }
nyx-store = { path = "../nyx-store" }
femcore = { path = "../femcore" }
# the same pool the solvers use: the blocks of a reduction run on it (ADR 90)
rayon = "1"
geom = { path = "../geom" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# results files (ADR 62, 102); pure-Rust HDF5 (hdf5-pure + zlib-rs), requiring no external HDF5_DIR or DLL
nyx-storage = { path = "../nyx-storage", optional = true }
hdf5-pure = { workspace = true, optional = true }
quick-xml = { version = "0.41", optional = true }

[features]
# the physics compiled into a build (plan: physics are compiled in, run-time plug-ins are out of scope)
default = ["dfs", "sms", "ems", "hdf5"]
dfs = ["dep:nyx-dfs"]
sms = ["dep:nyx-sms"]
ems = ["dep:nyx-ems"]
# results in HDF5 files (export_results, results_file_info, results.h5 in every recorded run); on by default since phase 8 (ADR 63, 102), pure Rust (hdf5-pure + zlib-rs) requiring no external HDF5_DIR or DLL; `--no-default-features --features dfs,sms,ems` builds without
hdf5 = ["dep:nyx-storage", "dep:hdf5-pure", "dep:quick-xml"]
# zero-C stub for `H5Mode::Parallel` (`hdf5-pure` has no MPI-IO driver; `mode_available(H5Mode::Parallel)` returns false without C/MPI)
phdf5 = ["hdf5"]

[dev-dependencies]
bolero = "0.13"
zip = { workspace = true }

[build-dependencies]
blake3 = "1"

