# Silicon nitride (stoichiometric LPCVD Si3N4 thin film): Luke 2015 optical Sellmeier + typical LPCVD mechanics/thermal/electrical.
format = 2
name = "silicon_nitride"
description = "Stoichiometric LPCVD Si3N4 film at 293 K (Luke 2015 Sellmeier 0.31-5.5 um, n=1.9963 at 1.55 um; E=290 GPa) — low-loss photonic baseline vs UV-VIS silicon_nitride_philipp and higher-index silicon_nitride_pecvd."
kind = "amorphous"
point_group = "isotropic"
reference_temperature = "293.15 K"
source = { cite = "APPROXIMATE thin-film compilation: [optical] verified from Luke et al. 2015; density 3100 kg/m^3 and mechanical/thermal/electrical are representative stoichiometric LPCVD Si3N4 film values that depend on furnace stress and stoichiometry", url = "https://refractiveindex.info/?shelf=main&book=Si3N4&page=Luke" }
density = "3100 kg/m^3"
residual_stress = [1.0e9, 1.0e9, 0.0, 0.0, 0.0, 0.0]
residual_stress_unit = "Pa"

[elastic]
unit = "GPa"
E = 290.0
nu = 0.27
source = { cite = "APPROXIMATE typical LPCVD stoichiometric Si3N4 thin-film modulus (250-290 GPa reported across MEMS handbooks depending on residual tensile stress ~0.9-1.2 GPa and Si:N ratio)" }

[thermal]
conductivity = 20.0
conductivity_unit = "W/(m*K)"
specific_heat = "700 J/(kg*K)"
expansion = 2.3e-6
expansion_unit = "1/K"
source = { cite = "APPROXIMATE thin-film LPCVD Si3N4 thermal properties (phonon-boundary scattering lowers k below bulk ~30 W/(m*K) beta-Si3N4)" }

[dielectric]
eps_clamped = 7.5
loss_tangent = 2.0e-4
loss_ref_freq = "10 GHz"
tls_tan_delta_0 = 3.0e-4
tls_e_crit = "20 V/m"
source = { cite = "APPROXIMATE static/RF relative permittivity and TLS dielectric loss of stoichiometric LPCVD Si3N4 (~7.0-8.0 across foundry PDKs)" }

[photoelastic]
wavelength = "1.55 um"
p11 = -0.125
p12 = 0.047
source = { cite = "APPROXIMATE stoichiometric LPCVD Si3N4 isotropic photoelastic constants at 1550 nm (Gyger et al., Phys. Rev. Lett. 124, 013902, 2020)" }

[optical]
wavelength_unit = "um"
range = [0.310, 5.504]
model = "sellmeier"
B = [3.0249, 40314.0]
lambda0 = [0.1353406, 1239.842]
source = { cite = "K. Luke, Y. Okawachi, M. R. E. Lamont, A. L. Gaeta, M. Lipson, Broadband mid-infrared frequency comb generation in a Si3N4 microresonator, Opt. Lett. 40, 4823-4826 (2015): Sellmeier fit of a 340 nm film on 3.1 um thermal SiO2, as in the refractiveindex.info database (Si3N4, Luke, CC0). Film index depends on deposition (stoichiometry): use your own ellipsometry for quantitative work", url = "https://refractiveindex.info/?shelf=main&book=Si3N4&page=Luke", doi = "10.1364/OL.40.004823", verified = "2026-11-04" }

[nonlinear]
T_range = [4.0, 600.0]

[nonlinear.chi3]
wavelength = "1.55 um"
n_2 = "2.4e-19 m^2/W"
beta_tpa = "0.0 m/W"
source = { cite = "APPROXIMATE stoichiometric LPCVD Si3N4 Kerr refractive index n_2 = 2.4e-19 m^2/W at 1550 nm with negligible two-photon absorption below the ~5 eV bandgap (K. Ikeda, R. E. Saperstein, N. Alic, Y. Fainman, Opt. Express 16, 12987-12994 (2008); D. J. Moss, R. Morandotti, A. L. Gaeta, M. Lipson, Nat. Photonics 7, 597-607 (2013))", doi = "10.1364/OE.16.012987" }
