# Aluminium: optical data (Lorentz-Drude fit of Rakic et al. 1998) + bulk/MEMS room-temperature mechanics/thermal/electrical + superconducting BCS parameters.
format = 2
name = "aluminium"
kind = "metal"
point_group = "isotropic"
reference_temperature = "293.15 K"
description = "Evaporated/MEMS aluminium at 293 K (Rakic 1998 Lorentz-Drude 0.06-248 um; E=70 GPa, k=237 W/(m*K)) — room-temperature normal-metal/electrode baseline vs mK superconducting aluminium_sc_emft."
source = { cite = "APPROXIMATE bulk/MEMS aluminium mechanics/thermal/electrical at 293 K + verified Rakic et al. 1998 [optical] fit (0.062-248 um)", doi = "10.1364/AO.37.005271" }
density = "2700 kg/m^3"

[elastic]
unit = "GPa"
E = 70.0
nu = 0.35
source = { cite = "APPROXIMATE polycrystalline aluminium / MEMSCAP PiezoMUMPs PADMETAL film values at 293 K (E ~ 68-70 GPa, nu = 0.35)" }

[thermal]
conductivity = 237.0
conductivity_unit = "W/(m*K)"
specific_heat = "900 J/(kg*K)"
expansion = 23.1e-6
expansion_unit = "1/K"
source = { cite = "APPROXIMATE pure bulk aluminium thermophysical values at 300 K" }

[electrical]
conductivity = 3.77e7
conductivity_unit = "S/m"
source = { cite = "APPROXIMATE pure bulk aluminium DC conductivity at 293 K (sheet resistance drops >10x for evaporated thin films below 4 K)" }

[optical]
wavelength_unit = "um"
range = [0.0620, 248.0]
model = "drude_lorentz"
frequency_unit = "eV"
plasma_frequency = 14.98
damping = 0.047
drude_weight = 0.523
oscillators = [
  [0.227, 0.162, 0.333],
  [0.050, 1.544, 0.312],
  [0.166, 1.808, 1.351],
  [0.030, 3.473, 3.382],
]
source = { cite = "A. D. Rakic, A. B. Djurisic, J. M. Elazar, M. L. Majewski, Optical properties of metallic films for vertical-cavity optoelectronic devices, Appl. Opt. 37, 5271-5283 (1998), Lorentz-Drude (LD) model; parameters in eV; compared with the n,k table the refractiveindex.info database computes from them", url = "https://refractiveindex.info/?shelf=main&book=Al&page=Rakic-LD", doi = "10.1364/AO.37.005271", verified = "2026-11-04" }

[superconducting]
tc = "1.20 K"
gap_0 = "180 ueV"
lambda_L = "16.0 nm"
xi_0 = "1600.0 nm"
sigma_n = "3.8e7 S/m"
source = { cite = "M. Tinkham, Introduction to Superconductivity, 2nd ed. (McGraw-Hill, 1996) and C. Kittel, Introduction to Solid State Physics, 8th ed. (Wiley, 2005): Al T_c = 1.20 K, Delta(0) = 180 ueV, London depth lambda_L(0) = 16 nm, BCS coherence length xi_0 = 1600 nm; APPROXIMATE thin-film cryogenic normal conductivity sigma_n = 3.8e7 S/m", verified = "2026-11-21" }
