# Si-rich PECVD silicon nitride film (Vogt 2015 SiN_x, n = 2.089 at 633 nm and 2.051 at 1550 nm).
format = 1
name = "silicon_nitride_pecvd"
description = "Low-stress Si-rich PECVD SiNx film (Vogt 2015 ellipsometry 0.25-1.70 um, n=2.051 at 1.55 um, E=210 GPa) — higher-index 300 C CMOS-compatible film vs stoichiometric LPCVD silicon_nitride (n=1.9963, E=270 GPa)."
source = { cite = "APPROXIMATE PECVD SiNx density/mechanics/thermal/electrical + verified Vogt 2015 [optical] ellipsometry table (refractiveindex.info main/Si3N4/Vogt-2, CC0)", url = "https://refractiveindex.info/?shelf=main&book=Si3N4&page=Vogt-2" }
