unit = "GPa"
E = 210.0
nu = 0.25
source = { cite = "APPROXIMATE typical low-temperature PECVD SiNx film modulus (lower than stoichiometric 800 C LPCVD Si3N4 due to Si-H/N-H incorporation and non-stoichiometric Si excess)" }

