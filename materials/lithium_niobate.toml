# Lithium niobate (LiNbO3), congruently grown, trigonal 3m class, optic axis = crystal z.
format = 1
name = "lithium_niobate"
description = "Congruent lithium niobate, room temperature"
source = { cite = "Compiled from the per-table sources below (Weis and Gaylord 1985 for density and constant-E stiffness; Zelmon, Small and Jundt 1997 for refractive indices)", verified = "2026-11-20" }
density = "4640 kg/m^3"

[elastic]
class = "trigonal"
unit = "GPa"
c11 = 203.0
c12 = 57.3
c13 = 75.2
c14 = 8.5
c33 = 242.4
c44 = 59.5
source = { cite = "R. S. Weis and T. K. Gaylord, Lithium niobate: Summary of physical properties and crystal structure, Appl. Phys. A 37, 191-203 (1985), Table 1 constant-E stiffness tensor at room temperature", doi = "10.1007/BF00614817", verified = "2026-11-20" }

[optical]
wavelength_unit = "um"
range = [0.4, 5.0]
source = { cite = "D. E. Zelmon, D. L. Small, D. Jundt, Infrared corrected Sellmeier coefficients for congruently grown lithium niobate and 5 mol.% magnesium oxide-doped lithium niobate, J. Opt. Soc. Am. B 14, 3319-3322 (1997), 21 degC, as in the refractiveindex.info database (LiNbO3, Zelmon-o and Zelmon-e, CC0)", url = "https://refractiveindex.info/?shelf=main&book=LiNbO3&page=Zelmon-o", doi = "10.1364/JOSAB.14.003319", verified = "2026-11-04" }

[optical.ordinary]
model = "sellmeier"
B = [2.6734, 1.2290, 12.614]
C = [0.01764, 0.05914, 474.60]

[optical.extraordinary]
model = "sellmeier"
B = [2.9804, 0.5981, 8.9543]
C = [0.02047, 0.0666, 416.08]
