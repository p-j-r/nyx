# Congruent lithium niobate (LiNbO3), trigonal 3m crystal with optic axis = crystal z. Orientation is set in the project.
format = 2
name = "lithium_niobate"
description = "Congruent bulk/TFLN LiNbO3 at 294 K (Weis & Gaylord 1985 trigonal c11=203 GPa + Zelmon 1997 uniaxial Sellmeier 0.4-5 um, ne=2.1376 at 1.55 um) — undoped baseline vs photorefractive-resistant lithium_niobate_mgo and cryogenic lithium_niobate_4k."
kind = "crystalline"
point_group = "3m"
crystal_setting = "IEEE-1987"
reference_temperature = "294.15 K"
notes = "Contains both clamped (eps_clamped) and mechanically free (eps_free) relative permittivities in [dielectric] together with piezoelectric, photoelastic, electro-optic, and viscoelastic tensors."
source = [
  { cite = "R. S. Weis and T. K. Gaylord, Lithium niobate: Summary of physical properties and crystal structure, Appl. Phys. A 37, 191-203 (1985): density 4640 kg/m^3 (Kushibiki et al. 1999 SAW-grade Archimedes measurement is 4642.8 kg/m^3)", doi = "10.1007/BF00614817", verified = "2026-11-21" },
  { cite = "D. E. Zelmon, D. L. Small, D. Jundt, J. Opt. Soc. Am. B 14, 3319-3322 (1997), optical Sellmeier verified 2026-11-04", doi = "10.1364/JOSAB.14.003319", verified = "2026-11-04" },
]
density = "4640 kg/m^3"

[elastic]
class = "trigonal"
unit = "GPa"
c11 = 203.0
c12 = 57.3
c13 = 75.2
c14 = 8.5
c33 = 242.4
c44 = 59.5
source = { cite = "R. S. Weis and T. K. Gaylord, Lithium niobate: Summary of physical properties and crystal structure, Appl. Phys. A 37, 191-203 (1985), Table 6 (p. 200), constant-electric-field stiffness C^E in IRE-1949 crystal frame", url = "https://lithium-niobate.com/data/", doi = "10.1007/BF00614817", verified = "2026-11-21" }

[thermal]
conductivity = 3.92
conductivity_unit = "W/(m*K)"
specific_heat = "628 J/(kg*K)"
expansion = { perp = 1.41e-5, par = 4.1e-6 }
expansion_unit = "1/K"
source = { cite = "T. Volk and M. Wohlecke, Lithium Niobate: Defects, Photorefraction and Ferroelectric Switching, Springer Series in Materials Science 115 (2009), Table 1.1 (p. 3) congruent LiNbO3 near 300 K", url = "https://lithium-niobate.com/data/", doi = "10.1007/978-3-540-70766-0", verified = "2026-11-21" }

[dielectric]
eps_clamped = { perp = 44.3, par = 27.9 }
eps_free = { perp = 85.2, par = 28.7 }
loss_tangent = 5.0e-4
loss_ref_freq = "10 GHz"
source = [
  { cite = "R. S. Weis and T. K. Gaylord, Appl. Phys. A 37, 191-203 (1985), Table 1 (p. 197), mechanically free (low-frequency) relative permittivity eps^T/eps0", url = "https://lithium-niobate.com/data/", doi = "10.1007/BF00614817", verified = "2026-11-21" },
  { cite = "APPROXIMATE Weis & Gaylord 1985 clamped GHz permittivity eps^S (~44.3 perp, ~27.9 par) and room-temperature microwave loss tangent" },
]

[piezoelectric]
form = "strain_charge"
unit = "pC/N"
d15 = 69.2
d22 = 20.8
d31 = -0.85
d33 = 6.0
source = { cite = "APPROXIMATE congruent LiNbO3 strain-charge piezoelectric coefficients (Weis & Gaylord 1985 Table 2 / Warner, Onoe & Coquin 1967)", doi = "10.1007/BF00614817" }

[photoelastic]
wavelength = "633 nm"
p11 = -0.026
p12 = 0.090
p13 = 0.133
p31 = 0.179
p33 = 0.071
p14 = -0.075
p41 = 0.151
p44 = 0.146
source = { cite = "APPROXIMATE congruent LiNbO3 Pockels photoelastic constants at 633 nm (Weis & Gaylord 1985 / Dixon 1967)" }

[electro_optic]
wavelength = "633 nm"
unit = "pm/V"
source = { cite = "APPROXIMATE congruent LiNbO3 linear electro-optic Pockels tensor at 633 nm (Weis & Gaylord 1985 Table 4)" }

[electro_optic.clamped]
r13 = 8.6
r22 = 3.4
r33 = 28.6
r51 = 28.0

[electro_optic.free]
r13 = 9.6
r22 = 6.8
r33 = 30.9
r51 = 32.6

[viscoelastic]
unit = "mPa*s"
eta11 = 5.0
eta12 = 1.2
eta13 = 1.0
eta33 = 5.5
eta44 = 2.0
source = { cite = "APPROXIMATE room-temperature congruent LiNbO3 effective acoustic viscosity (order-of-magnitude GHz BAW attenuation baseline)" }

[optical]
wavelength_unit = "um"
range = [0.4, 5.0]
source = { cite = "D. E. Zelmon, D. L. Small, D. Jundt, Infrared corrected Sellmeier coefficients for congruently grown lithium niobate and 5 mol.% magnesium oxide-doped lithium niobate, J. Opt. Soc. Am. B 14, 3319-3322 (1997), 21 degC, as in the refractiveindex.info database (LiNbO3, Zelmon-o and Zelmon-e, CC0)", url = "https://refractiveindex.info/?shelf=main&book=LiNbO3&page=Zelmon-o", doi = "10.1364/JOSAB.14.003319", verified = "2026-11-04" }

[optical.ordinary]
model = "sellmeier"
B = [2.6734, 1.2290, 12.614]
C = [0.01764, 0.05914, 474.60]

[optical.extraordinary]
model = "sellmeier"
B = [2.9804, 0.5981, 8.9543]
C = [0.02047, 0.0666, 416.08]
