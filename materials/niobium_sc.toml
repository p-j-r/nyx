# Niobium (Nb) BCC crystal & superconducting thin film at 4.2 K (MIT-LL SFQ5ee / Carroll 1965 / Golovashkin 1969).
format = 2
name = "niobium_sc"
kind = "superconductor"
point_group = "m-3m"
reference_temperature = "4.2 K"
description = "Nb superconducting film/crystal at 4.2 K (Carroll 1965 BCC c11=252.7 GPa + Golovashkin 1969 4.2 K n,k 0.4-9.2 um; Tc=9.2 K, lambda_L=90 nm, Lk=0.09 pH/sq) — highest elemental Tc for SFQ and cQED resonators vs tantalum_alpha_sc."
notes = "Superconducting parameters (MIT-LL SFQ5ee M1-M7 & standard cQED Nb): Tc = 8.8-9.2 K, Delta_0 = 1.45 meV, lambda_L(0) = 85-110 nm (90 nm nominal), Lk = 0.06-0.15 pH/sq. Native Nb2O5 (~5 nm) adds higher MA TLS loss unless BOE-stripped or encapsulated."
source = [
  { cite = "K. J. Carroll, Elastic constants of niobium from 4.2 to 300 K, J. Appl. Phys. 36, 3689-3690 (1965): density 8570 kg/m^3", doi = "10.1063/1.1703072", verified = "2026-11-21" },
