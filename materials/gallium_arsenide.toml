# Gallium arsenide (GaAs), zincblende cubic crystal, 295-300 K.
format = 1
name = "gallium_arsenide"
description = "Undoped bulk GaAs cubic crystal (Blakemore 1982 elastic c11=118.8 GPa + Skauli 2003 IR Sellmeier 0.97-17 um, n=3.3702 at 1.55 um) — sub-bandgap III-V photonics/SAW baseline vs absorbing gallium_arsenide_papatryfonos."
source = [
  { cite = "J. S. Blakemore, Semiconducting and other major properties of gallium arsenide, J. Appl. Phys. 53, R123-R181 (1982): density 5317 kg/m^3 at 300 K", doi = "10.1063/1.331665", verified = "2026-11-21" },
  { cite = "T. Skauli et al., Improved dispersion relations for GaAs and applications to nonlinear optics, J. Appl. Phys. 94, 6447-6455 (2003)", doi = "10.1063/1.1621740", verified = "2026-11-21" },
]
density = "5317 kg/m^3"

[elastic]
class = "cubic"
unit = "GPa"
c11 = 118.8
c12 = 53.8
c44 = 59.4
