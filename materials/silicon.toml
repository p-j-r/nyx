# Single-crystal silicon at room temperature. Crystal axes along the cube edges (orientation is set in the project).
format = 1
name = "silicon"
description = "Single-crystal silicon, 293 K"
source = [
  "Stiffness: typical room-temperature values, Hopcroft et al., J. Microelectromech. Syst. 19, 229 (2010) (rounded; the nyx test suite uses these)",
  "Refractive index: H. H. Li, J. Phys. Chem. Ref. Data 9, 561 (1980) as tabulated for 293 K by the refractiveindex.info database (CC0)",
]
notes = "dn_dT is approximate (about 1.8e-4 1/K near 1.55 um); check it against a measurement before quantitative thermo-optic work."
density = "2329 kg/m^3"

[elastic]
class = "cubic"
unit = "GPa"
c11 = 165.7
c12 = 63.9
c44 = 79.6

[thermal]
conductivity = 130.0
conductivity_unit = "W/(m*K)"
specific_heat = "700 J/(kg*K)"
expansion = 2.6e-6
expansion_unit = "1/K"

[electrical]
permittivity = 11.7

[optical]
wavelength_unit = "um"
range = [1.2, 14.0]
reference_temperature = "293.15 K"
model = "tabulated"
dn_dT = "1.8e-4 1/K"
data = [
