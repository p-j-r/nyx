# Gold: optical data (Lorentz-Drude fit of Rakic et al. 1998) + bulk room-temperature mechanical/thermal/electrical baseline.
format = 2
name = "gold"
description = "Evaporated Au wide-band Lorentz-Drude fit at 293 K (Rakic 1998, 0.25-6.2 um; E=78 GPa, sigma=4.52e7 S/m) — broadband analytical baseline vs lower-loss NIR experimental gold_johnson."
kind = "metal"
point_group = "isotropic"
reference_temperature = "293.15 K"
source = { cite = "APPROXIMATE bulk polycrystalline mechanics/thermal/electrical + verified Rakic et al. 1998 [optical] fit (0.248-6.2 um)", doi = "10.1364/AO.37.005271" }
density = "19300 kg/m^3"

[elastic]
unit = "GPa"
E = 78.0
nu = 0.42
source = { cite = "APPROXIMATE polycrystalline bulk gold handbook values at 293 K (electroplated/evaporated thin films show grain-texture variation E ~ 70-82 GPa)" }

[thermal]
conductivity = 317.0
conductivity_unit = "W/(m*K)"
specific_heat = "129 J/(kg*K)"
expansion = 14.2e-6
expansion_unit = "1/K"
source = { cite = "APPROXIMATE standard bulk gold thermophysical handbook values at 300 K (thin films exhibit lower electron thermal conductivity)" }

[electrical]
conductivity = 4.52e7
conductivity_unit = "S/m"
source = { cite = "APPROXIMATE bulk pure gold DC conductivity at 293 K; thin films have lower conductivity from surface and grain-boundary scattering" }

[optical]
wavelength_unit = "um"
range = [0.2480, 6.1992]
model = "drude_lorentz"
frequency_unit = "eV"
plasma_frequency = 9.03
damping = 0.053
drude_weight = 0.760
oscillators = [
  [0.024, 0.415, 0.241],
  [0.010, 0.830, 0.345],
  [0.071, 2.969, 0.870],
  [0.601, 4.304, 2.494],
  [4.384, 13.32, 2.214],
]
source = { cite = "A. D. Rakic, A. B. Djurisic, J. M. Elazar, M. L. Majewski, Optical properties of metallic films for vertical-cavity optoelectronic devices, Appl. Opt. 37, 5271-5283 (1998), Lorentz-Drude (LD) model; parameters in eV; compared with the n,k table the refractiveindex.info database computes from them", url = "https://refractiveindex.info/?shelf=main&book=Au&page=Rakic-LD", doi = "10.1364/AO.37.005271", verified = "2026-11-04" }
